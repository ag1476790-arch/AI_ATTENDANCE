services:
  - type: web
    name: ai-attendance
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FIREBASE_PROJECT_ID
        value: ai-attendance-14ab6
      - key: FIREBASE_AUTH_DOMAIN
        value: ai-attendance-14ab6.firebaseapp.com
      - key: FIREBASE_API_KEY
        value: AIzaSyB3zHWbnGt9AonsW3eSfmrDwVbIeN9lW8s
      - key: FIREBASE_APP_ID
        value: 1:267945466487:web:f90f1263c30756e05d8472
